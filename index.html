function frase(u,est){ const a=FRASES[est]; let h=7; (u.id+hoyS()).split("").forEach(c=>h=(h*31+c.charCodeAt(0))>>>0); return a[h%a.length]; }

function proximoCambio(u,i){
  if(enPausa(u)) return "En pausa: tu mascota no pierde peso.";
  if(i.sick) return "Enferma: la comida no le hace efecto hasta la medicina.";
  const rate=100/DECAY(); const sig=i.est==="radiante"?[75,"contenta"]:i.est==="contenta"?[50,"normal"]:i.est==="normal"?[33,"flaca"]:[0,"enferma"];
  const d=Math.max(1,Math.ceil((i.e-sig[0])/rate));
  return `Si no come, pasa a «${EST_NOM[sig[1]].toLowerCase()}» en unos ${d} día${d>1?"s":""}.`;
}

function pInitPremios(){
  const b=$("#btnPremios"); if(!b) return;
  for(let i=0;i<3;i++){ const s=$("#pcK"+i); if(s) s.onchange=()=>{ const t=$("#pcIlu"+i); if(t) t.innerHTML=ilustracion(s.value); }; }
  b.onclick=async()=>{
    const L=[]; for(let i=0;i<3;i++) L.push({k:$("#pcK"+i).value,pct:Number($("#pcP"+i).value)});
    if(L.some(p=>!(p.pct>=10&&p.pct<=100))){ toast("Los porcentajes van de 10 a 100","!"); return; }
    if(new Set(L.map(p=>p.k)).size<3){ toast("Elige tres premios distintos","!"); return; }
    L.sort((a,b)=>a.pct-b.pct);
    if(L[0].pct===L[1].pct||L[1].pct===L[2].pct){ toast("Cada premio necesita un porcentaje distinto","!"); return; }
    const t=b.innerHTML; b.disabled=true; b.innerHTML=`<span class="spin"></span> Guardando…`;
    const r=await call("guardarPremios",{premios:L});
    b.disabled=false; b.innerHTML=t;
    if(!r.ok){ toast(r.msg||"No se pudo guardar","!"); return; }
    render(); toast("Premios actualizados","★");
  };
}

function openSheet(html){ closeSheet();
  document.body.insertAdjacentHTML("beforeend",`<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`);
  return $("#sheet"); }
function closeSheet(){ const s=$("#sheet"); if(s) s.remove(); document.removeEventListener("keydown",pinKey); }
const phead=(t,extra)=>`<div class="phead"><h3>${t}</h3>${extra||""}<button class="x" data-close aria-label="Cerrar">✕</button></div>`;

/* ----- PIN ----- */
let PIN=null;
function pinKey(ev){ if(!PIN) return; if(/^\d$/.test(ev.key)) pinDigit(ev.key); else if(ev.key==="Backspace") pinDigit("<"); }
function abrirPin(uid,dest){
  const u=U(uid), crear=!u.tienePin, i=info(u);
  PIN={uid,crear,paso:crear?1:0,buf:"",first:"",dest:dest||"mi"};
  openSheet(`<div class="phead" style="border-bottom:0;padding-bottom:0"><h3></h3><button class="x" data-close aria-label="Cerrar">✕</button></div><div class="pbody"><div class="pinbox" data-st="${i.est}">
    <div class="pm">${petOf(u,{info:i})}</div><h3>${esc(nomMascota(u))}</h3>
    <p id="pinSub"></p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="pinerr" id="pinErr"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="digit" data-d="${n}">${n}</button>`).join("")}<span></span><button data-act="digit" data-d="0">0</button><button class="ghost" data-act="digit" data-d="<" aria-label="Borrar">⌫</button></div>
  </div></div>`);
  pinTexto(); document.addEventListener("keydown",pinKey);
}
function pinTexto(){ if(!PIN) return; const u=U(PIN.uid);
  $("#pinSub").textContent = PIN.crear ? (PIN.paso===1?`Hola, ${primer(u.nombre)}. Crea tu PIN de 4 dígitos.`:"Repite tu PIN para confirmarlo.") : `${primer(u.nombre)}, escribe tu PIN.`;
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k<PIN.buf.length)); }
async function pinDigit(d){ if(!PIN||PIN.busy) return;
  if(d==="<") PIN.buf=PIN.buf.slice(0,-1); else if(PIN.buf.length<4) PIN.buf+=d;
  $("#pinErr").textContent=""; pinTexto();
  if(PIN.buf.length<4) return;
  const falla=m=>{ $("#pinErr").textContent=m; const dt=$("#dots"); dt.classList.remove("shake"); void dt.offsetWidth; dt.classList.add("shake"); PIN.buf=""; setTimeout(pinTexto,350); };
  if(PIN.crear&&PIN.paso===1){ PIN.first=PIN.buf; PIN.buf=""; PIN.paso=2; setTimeout(pinTexto,120); return; }
  if(PIN.crear&&PIN.paso===2&&PIN.buf!==PIN.first){ PIN.paso=1; PIN.first=""; falla("Los PIN no coinciden. Empieza de nuevo."); return; }
  PIN.busy=true;
  const r=await call("login",{uid:PIN.uid,pin:PIN.buf});
  if(!r.ok){ PIN.busy=false; falla(r.msg||"No se pudo ingresar."); return; }
  ST.sesion={id:PIN.uid,pin:PIN.buf}; persist(); const dest=PIN.dest; PIN=null; closeSheet(); vista=dest; gearBack=dest==="ajustes"?"salir":null; render(); $("main").scrollTop=0;
}

/* ----- equipo (EIME) ----- */
function abrirEq(id){
  const e=eqp(id), st=estado(e), o=e.resp?U(e.resp):null, yoU=yo();
  const esMio=yoU&&e.resp===yoU.id, pronto=yaVerif(e), perA=periodoEime(e.freq,hoyS());
  const hist=DB.verif.filter(v=>v.eq===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const ident=[["Descripción",e.desc],["Marca",e.marca],["Modelo",e.modelo],["Nº de serie",e.serie],["Código EIME",e.eime],
    ["Rango",e.rango],["Resolución",e.res],["Frecuencia",e.freq[0].toUpperCase()+e.freq.slice(1)],["IT de verificación",e.it],
    ["Patrón utilizado",e.patron],["Código patrón",e.cpatron],["Certificado Nº",e.cert],["Trazabilidad",e.traz],["Responsable",o?o.nombre:"Sin asignar"]];
  const filas=e.pts.map((p,i)=> e.pasa
    ? `<div class="prow"><span class="nom"><b style="font-size:13px;font-family:var(--f-body)">${esc(p.e)}</b><span>Criterio: ${p.v}</span></span>
       <select data-pt="${i}" id="pt${i}"><option value="">—</option><option>PASA</option><option>NO PASA</option></select></div>`
    : `<div class="prow"><span class="nom"><b>${p.e?esc(p.e)+" · ":""}${nf(p.v,p.v<10?2:p.v<100?1:0)} ${e.u}</b><span>Tolerancia ±${nf(p.tol,p.tol<1?3:p.tol<10?1:0)} ${e.u}</span></span>
       <input type="number" step="any" inputmode="decimal" data-pt="${i}" id="pt${i}" placeholder="—">
       <span class="res" id="res${i}"></span></div>`).join("");
  let aviso="";
  if(!esMio) aviso=`<div class="alert warn" style="margin-bottom:14px"><p>${o?`Este equipo está a cargo de <b>${esc(o.nombre)}</b>. Solo su responsable puede verificarlo.`:`Este equipo aún no tiene responsable. El administrador puede asignarlo en Ajustes.`}</p></div>`;
  else if(pronto) aviso=`<div class="alert ok" style="margin-bottom:14px"><p><b>Listo por ${esc(perA.nombre)}.</b> El próximo período parte el ${fmt(sigPeriodo(e.freq,perA).ini)} y su ventana cierra el ${fmt(vence(e))}.</p></div>`;
  else if(hoyS()<perA.abre) aviso=`<div class="note" style="margin:0 0 14px">Puedes verificar cuando quieras. Es obligatorio entre el ${fmt(perA.abre)} y el ${fmt(perA.fin)}.</div>`;
  const form = esMio&&!pronto ? `
      <div class="eyebrow" style="margin-bottom:8px">Nueva verificación · hoy ${fmt(hoyS())}</div>
      <div class="ptable"><div class="prow head"><span>Punto patrón</span><span style="text-align:right">Lectura</span></div>${filas}</div>
      ${e.temp?`<div class="fieldrow"><div><label class="fl" for="fTemp">Temperatura de la muestra (°C)</label><input class="inp mono" type="number" step="any" id="fTemp" placeholder="25,0"></div></div>`:""}
      <div class="fieldrow"><div><label class="fl" for="fObs">Observaciones</label><textarea class="inp" id="fObs" placeholder="Sin observaciones"></textarea></div></div>
      <div class="saverow"><button class="btn" id="btnSave">${ic("chk",18)} Registrar verificación</button><button class="btn ghost" data-close>Cancelar</button></div>` : "";
  openSheet(`<div class="phead"><span style="width:44px;height:36px;display:grid;place-items:center;flex:none;overflow:hidden">${viz(e.tipo)}</span>
      <h3>${esc(e.n)}</h3><span class="pill ${st.k}">${st.t}</span><button class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="pbody">
      <details class="ident"><summary>Identificación y trazabilidad</summary><div class="identgrid">${ident.map(([k,v])=>`<div><span>${k}</span><b>${esc(v||"—")}</b></div>`).join("")}</div></details>
      ${aviso}${form}
      <div class="hist"><h4>Historial</h4>
        ${hist.length?hist.map(v=>`<div class="hrow"><span class="d">${fmt(v.fecha)}</span><span class="pill ${v.cumple?"ok":"bad"}">${v.cumple?"Conforme":"No conforme"}</span>
          <span class="who2">${esc(U(v.usuario)?.nombre||"")}</span>${starsHTML(v.estrellas)}</div>`).join("")
         :`<div class="hrow"><span class="d">${fmt(e.ult)}</span><span class="pill mute">Planilla</span><span class="who2">Última verificación cargada del Excel</span></div>`}</div></div>`);
  const sh=$("#sheet");
  if(!form) return;
  function recalcL(){ e.pts.forEach((p,i)=>{ const el=$("#pt"+i,sh), out=$("#res"+i,sh); if(!out) return;
    const val=parseFloat(String(el.value).replace(",","."));
    if(!el.value||isNaN(val)){ out.innerHTML=""; return; }
    const er=val-p.v, rel=p.v?er/p.v*100:0, ok=Math.abs(er)<=p.tol;
    out.innerHTML=`<span>Error abs. <b style="color:var(--fg)">${er>0?"+":""}${nf(er,p.v<10?3:2)} ${e.u}</b></span><span>· rel. <b style="color:var(--fg)">${rel>0?"+":""}${nf(rel,1)} %</b></span>
      <span class="pill ${ok?"ok":"bad"}" style="font-size:10.5px">${ok?"Dentro de tolerancia":"Fuera de tolerancia"}</span>`; }); }
  $$("[data-pt]",sh).forEach(i=>i.addEventListener("input",recalcL));
  $("#btnSave",sh).onclick=async()=>{
    const lect=[];
    for(let i=0;i<e.pts.length;i++){ const el=$("#pt"+i,sh); if(!el.value){ toast("Falta completar el punto "+(i+1),"!"); el.focus(); return; } lect.push(el.value); }

    const r=await call("guardarVerificacion",{equipoId:e.id,lecturas:lect,temperatura:e.temp?$("#fTemp",sh).value:"",observaciones:$("#fObs",sh).value});
    if(!r.ok){ b.disabled=false; b.innerHTML=txt0; toast(r.msg||"No se pudo guardar","!"); return; }
    closeSheet(); render(); mostrarPremio(r.premio);
  };
}

      <div class="respgrid">${ad.map(u=>`<button class="respbtn" data-act="gearQuien" data-id="${u.id}">${esc(primer(u.nombre))}</button>`).join("")}</div></div>`); },
  ptSig(){ PT++; pintaPortada(); }, ptAtras(){ PT--; pintaPortada(); }, ptCierra(){ cierraPortada(); },
  gearQuien(d){ abrirPin(d.id,"ajustes"); },
  "go-eime"(){ go("eime"); }, "go-s5"(){ go("s5"); }, "go-rank"(){ go("rank"); }, "go-ajustes"(){ go("ajustes"); },
  salir(){ ST.sesion=null; persist(); vista="corral"; render(); },
  editPet(){ abrirEditPet(); }, tienda(){ abrirTienda(); },
  eq(d){ abrirEq(d.id); }, filtro(d){ filtro=d.f; render(); },
  async medicina(){ const r=await call("comprarMedicina"); if(!r.ok){ toast(r.msg,"!"); return; } render(); toast("¡Se está recuperando!","✚"); },
  digit(d){ pinDigit(d.d); },
  ajtab(d){ ajTab=d.t; render(); },
  perAdd(){ abrirPersona(""); }, perEdit(d){ abrirPersona(d.id); },
  async pausa(d){ const r=await call("pausa",{objetivo:d.id,on:d.on==="1"}); if(!r.ok){ toast(r.msg,"!"); return; } render(); toast(d.on==="1"?"Pausa activada":"Pausa terminada"); },
  async pausaTodos(d){ const r=await call("pausa",{objetivo:"todos",on:d.on==="1"}); if(!r.ok){ toast(r.msg,"!"); return; } render(); toast(d.on==="1"?"Todos en pausa":"Pausa terminada"); },
  async exportar(){ const r=await call("exportarExcel"); if(!r.ok){ toast(r.msg,"!"); return; }
    $("#expRes").innerHTML = r.url ? `<div class="alert warn" style="margin-bottom:12px"><p>Listo: <a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.nombre||"Abrir archivo")}</b></a></p></div>`
      : `<div class="note" style="margin:0 0 12px">En la vista previa no se genera el archivo. Usa «Copiar tabla».</div>`; },
  async copiar(){ const txt=[HEAD,...filasExport()].map(r=>r.join("\t")).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("Tabla copiada · pégala en Excel"); }
    catch(e){ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); toast("Tabla copiada"); }catch(_){ toast("No se pudo copiar","!"); } t.remove(); } },
  reintentar(){ refresh(true); },
  s5plano(d){ s5Plano=d.id; render(); },
  eqFiltro(d){ eqFiltro=d.f; render(); },
  eqFicha(d){ abrirFichaEq(d.id); },
  eqNuevo(){ abrirFichaEq(""); },
  eqMotivo(d){ abrirMotivoEq(d.id,d.k); },
  eqChip(d){ const i=$("#motEq"); i.value=d.m; i.focus(); },
  eqAddPt(){ leerFicha(); WEQ.pts.push({e:"",v:"",tol:""}); pintaFicha();
    const p=$("#sheet .panel"); if(p) p.scrollTop=p.scrollHeight; },
  eqQuitaPt(d){ leerFicha(); WEQ.pts.splice(Number(d.i),1); pintaFicha(); },
  async eqConfirma(d){ const motivo=($("#motEq").value||"").trim();
    if(!motivo){ $("#motEq").focus(); toast("Falta el motivo","!"); return; }
    const r=await call("estadoEquipo",{equipoId:d.id,estado:d.k,motivo});
    if(!r.ok){ toast(r.msg,"!"); return; }
    closeSheet(); render(); toast(d.k==="baja"?"Equipo dado de baja":"Equipo bloqueado"); },
  async eqReactivar(d){ const r=await call("estadoEquipo",{equipoId:d.id,estado:"activo"});
    if(!r.ok){ toast(r.msg,"!"); return; } render(); toast("Equipo reactivado"); },
  async eqGuardar(){
    leerFicha(); const W=WEQ, nuevo=!W.id;
    W.n=String(W.n||"").trim();
    if(!W.n){ toast("Falta el nombre","!"); $("#w_n")&&$("#w_n").focus(); return; }
    W.pts=(W.pts||[]).filter(p=>String(p.e||"").trim()!==""||String(p.v||"").trim()!=="")
      .map(p=>W.pasa?{e:String(p.e||"").trim()}:{e:String(p.e||"").trim(),v:Number(String(p.v).replace(",",".")) ||0,tol:Number(String(p.tol).replace(",",".")) ||0});
    let resumen="";
    if(!nuevo){ const a=eqp(W.id), c=[];
      Object.keys(C_NOM).forEach(k=>{ if(String(a[k]||"")!==String(W[k]||"")) c.push(C_NOM[k]); });
      if(JSON.stringify(a.pts||[])!==JSON.stringify(W.pts)) c.push("puntos de verificación");
      resumen=c.join(", "); }
    const r=await call("guardarEquipo",{equipo:W,resumen});
    if(!r.ok){ toast(r.msg,"!"); return; }
    closeSheet(); render(); toast(nuevo?"Equipo creado":"Ficha guardada"); }
};
document.addEventListener("click",ev=>{
  if(ev.target.closest("[data-close]")){ closeSheet(); PIN=null; return; }
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const fn=ACT[t.dataset.act]||ZACT[t.dataset.act]||EACT[t.dataset.act]||RACT[t.dataset.act]||JACT[t.dataset.act]||RTACT[t.dataset.act]; if(fn) fn(t.dataset,t,ev);
});
document.addEventListener("change",async ev=>{
  const f=ev.target.closest("[data-act-change='eqTipo'],[data-act-change='eqPasa']");
  if(f){ leerFicha();
    if(f.dataset.actChange==="eqTipo"&&WMODO==="nuevo"){
      if(String(WEQ.tipo).indexOf("eq:")===0){ copiarDe(eqp(WEQ.tipo.slice(3))); }
      else if(WEQ.tipo&&WEQ.tipo!=="blank"){ copiarDe(DB.equipos.filter(q=>q.tipo===WEQ.tipo)[0]); }
    }
    if(f.dataset.actChange==="eqPasa") WEQ.pts=WEQ.pts.map(p=>({e:p.e||"",v:"",tol:""}));
    pintaFicha(); return; }
  const t=ev.target.closest("[data-act-change='asig']"); if(!t) return;
  const r=await call("asignarEquipo",{equipoId:t.dataset.id,responsableId:t.value});
  if(!r.ok){ toast(r.msg,"!"); render(); return; } toast("Responsable actualizado");
});
$("#helpBtn").onclick=abrirPortada;
$("#userChip").onclick=()=>{ if(yo()) go("mi"); };
$("#themeBtn").onclick=()=>{ const a=ST.tema||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  ST.tema=a==="dark"?"light":"dark"; aplicaTema(); persist(); };
function aplicaTema(){ if(ST.tema) document.documentElement.setAttribute("data-theme",ST.tema); else document.documentElement.removeAttribute("data-theme"); }

async function boot(){
  load(); aplicaTema();
  if(!ONLINE){ if(!DB||!DB.mov) DB=seedDemo(); if(!DB.planos5s) DB.planos5s=JSON.parse(JSON.stringify(PLANOS_SEED)); recalc(); }
  if(DB&&ST.sesion&&!U(ST.sesion.id)) ST.sesion=null;
  if(DB) render(); else $("#view").innerHTML=`<div class="empty">Despertando al corral…</div>`;
  if(ONLINE){ await refresh(true);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-lastSync>45000) refresh(); });
    setInterval(()=>{ if(document.visibilityState==="visible") refresh(); },120000); }
  if(DB&&!ST.intro&&!ST.sesion) abrirPortada();
  setInterval(()=>{ if(DB&&!$("#sheet")&&!editando()&&document.visibilityState==="visible") render(); },300000);
}
boot();

</script>
