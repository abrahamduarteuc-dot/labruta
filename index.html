<style>
/* Layout: hub central con botones grandes de color por módulo; se entra y se vuelve al hub (sin barra inferior) */
:root{
  --bg:#EBEEF0; --surface:#FFFFFF; --surface-2:#F4F7F8; --line:#D5DDE1; --line-soft:#E4EAED;
  --fg:#13212A; --fg-dim:#4A5C66; --fg-mute:#7B8D97;
  --accent:#0B6B74; --accent-d:#064B52; --accent-soft:#D9ECEE;
  --brass:#A8761F; --brass-soft:#F5E8D0;
  --ok:#17704A; --ok-soft:#D7EEE2; --warn:#A6681A; --warn-soft:#F8E9D1; --bad:#A93A31; --bad-soft:#F8DEDB;
  --m-eime:#0B6B74; --m-s5:#6B46C1; --m-rank:#A8761F; --m-exp:#1565C0;
  --shadow:0 1px 2px rgba(19,33,42,.06), 0 8px 24px -12px rgba(19,33,42,.22);
  --r:14px;
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Asap',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1619; --surface:#152126; --surface-2:#1A292F; --line:#2A3C43; --line-soft:#223238;
  --fg:#E5EEF0; --fg-dim:#9FB3B9; --fg-mute:#6D858D;
  --accent:#45BCC6; --accent-d:#7FD6DD; --accent-soft:#0F3338;
  --brass:#D9A441; --brass-soft:#3629104D;
  --ok:#4FB37B; --ok-soft:#10301F; --warn:#DFA544; --warn-soft:#33260F; --bad:#E0756A; --bad-soft:#381B18;
  --m-eime:#2F9BA6; --m-s5:#8B6BE0; --m-rank:#D9A441; --m-exp:#4A8FE0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1619; --surface:#152126; --surface-2:#1A292F; --line:#2A3C43; --line-soft:#223238;
  --fg:#E5EEF0; --fg-dim:#9FB3B9; --fg-mute:#6D858D;
  --accent:#45BCC6; --accent-d:#7FD6DD; --accent-soft:#0F3338;
  --brass:#D9A441; --brass-soft:#3629104D;
  --ok:#4FB37B; --ok-soft:#10301F; --warn:#DFA544; --warn-soft:#33260F; --bad:#E0756A; --bad-soft:#381B18;
  --m-eime:#2F9BA6; --m-s5:#8B6BE0; --m-rank:#D9A441; --m-exp:#4A8FE0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.015em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.tb-left{display:flex;align-items:center;gap:9px;min-width:0;flex:none}
.logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent-d));display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.logo svg{width:18px;height:18px}
.tb-left b{font-family:var(--f-disp);font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.back{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--fg-dim);background:var(--surface-2);border:1px solid var(--line)}
.back:hover{color:var(--fg);border-color:var(--accent)}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
main{overflow-y:auto;overflow-x:hidden;min-height:0;
  padding-block:20px calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){ main{padding-block:28px 48px} }
.wrap{max-width:1060px;margin:0 auto}

/* ---------- AVATAR ---------- */
.av{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;position:relative;background:var(--surface-2)}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.ring{box-shadow:0 0 0 2.5px var(--surface),0 0 0 5px var(--brass)}

/* ---------- PIEZAS ---------- */
  background:var(--brass-soft);border-radius:999px;padding:5px 11px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-mute);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--fg-mute);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;
  padding:11px 18px;border-radius:11px;transition:.14s;box-shadow:0 1px 2px rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06181B}}
:root[data-theme="dark"] .btn{color:#06181B}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg-dim);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:9px}
.stars{display:inline-flex;gap:1px} .stars svg{width:14px;height:14px}
.empty{padding:34px 20px;text-align:center;color:var(--fg-mute);border:1px dashed var(--line);border-radius:var(--r);font-size:13.5px}
.note{font-size:12.5px;color:var(--fg-mute);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:14px;line-height:1.55}

/* ---------- EQUIPOS ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{font-size:24px;font-weight:800;letter-spacing:-.035em}
.pagehead p{margin:2px 0 0;color:var(--fg-mute);font-size:13px}
.tabs{display:flex;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.tabs button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg-mute)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.eqgrid{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:560px){.eqgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:920px){.eqgrid{grid-template-columns:repeat(3,1fr)}}
.eq{text-align:left;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;transition:.16s;position:relative}
.eq:hover{transform:translateY(-3px);border-color:var(--accent)}
.eq .viz{height:104px;background:var(--surface-2);border-bottom:1px solid var(--line-soft);display:grid;place-items:center;position:relative;overflow:hidden}
.eq .viz svg{width:122px;height:96px}
.eq .st{position:absolute;top:9px;right:9px}
.eq .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.eq .body h4{font-size:15px;font-weight:700;letter-spacing:-.01em}
.eq .body .sub{font-size:11.5px;color:var(--fg-mute)}
.eq .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft)}
.eq .due{font-family:var(--f-mono);font-size:11.5px;font-weight:500}
.owner{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-mute)}

/* ---------- SHEET ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.sheet{align-items:center}}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,18,22,.55);backdrop-filter:blur(2px);animation:fade .2s}
.sheet .panel{position:relative;background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;border:1px solid var(--line);animation:up .26s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.sheet .panel{border-radius:18px;max-height:88vh;padding-bottom:16px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(22px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet .panel,.sheet .scrim{animation:none}}
.phead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:13px 15px;display:flex;gap:11px;align-items:center;z-index:2}
.phead h3{font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.phead .x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--fg-mute);flex:none}
.phead .x:hover{background:var(--surface-2);color:var(--fg)}
.pbody{padding:16px}
details.ident{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--surface-2)}
details.ident summary{padding:11px 14px;font-weight:600;font-size:13.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.ident summary::-webkit-details-marker{display:none}
details.ident summary::after{content:"＋";color:var(--fg-mute);font-family:var(--f-mono)}
details.ident[open] summary::after{content:"−"}
.identgrid{display:grid;gap:0 18px;grid-template-columns:1fr;padding:0 14px 12px;border-top:1px solid var(--line-soft)}
@media(min-width:560px){.identgrid{grid-template-columns:1fr 1fr}}
.identgrid div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.identgrid span{color:var(--fg-mute);flex:none} .identgrid b{font-weight:600;text-align:right;word-break:break-word}
.ptable{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line-soft)}
.prow:last-child{border-bottom:0}
.prow.head{background:var(--surface-2);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-mute);font-weight:600;padding:8px 13px}
.prow .nom b{font-family:var(--f-mono);font-size:14.5px;font-weight:600;display:block}
.prow .nom span{font-size:11px;color:var(--fg-mute)}
.prow input[type=number],.prow input[type=text]{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  font-family:var(--f-mono);font-size:14.5px;text-align:right}
.prow input:focus,.prow select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.prow select{width:100%;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13.5px}
.res{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-family:var(--f-mono);color:var(--fg-mute)}
.fieldrow{display:grid;gap:10px;grid-template-columns:1fr;margin-top:13px}
@media(min-width:560px){.fieldrow.two{grid-template-columns:1fr 1fr}}
label.fl{display:block;font-size:11.5px;color:var(--fg-mute);font-weight:600;margin-bottom:5px;letter-spacing:.03em}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:62px;font-family:var(--f-body)}
.saverow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.saverow .btn{flex:1;min-width:140px}
.hist{margin-top:18px}
.hist h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);margin-bottom:9px}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.hrow .d{font-family:var(--f-mono);font-size:12.5px;font-weight:600;width:78px;flex:none}
.hrow .who2{color:var(--fg-mute);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- EXPORT ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:720px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{background:var(--surface-2);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);position:sticky;top:0}
td.num{font-family:var(--f-mono);text-align:right}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--fg);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;max-width:min(92vw,420px);
  opacity:0;pointer-events:none;transition:.22s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ---------- ANIMACIONES ---------- */
@keyframes sweep{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(30deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}18%{opacity:1}100%{transform:translateY(17px);opacity:0}}
@keyframes spinm{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes beam{0%,100%{opacity:.3}50%{opacity:.95}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.a-sweep{transform-origin:50% 88%;animation:sweep 3.4s ease-in-out infinite}
.a-drip{animation:drip 1.9s linear infinite}
.a-spin{animation:spinm 3.6s linear infinite}
.a-blip{animation:blip 1.7s ease-in-out infinite}
.a-beam{animation:beam 2.4s ease-in-out infinite}
.a-bob{animation:bob 2.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.a-sweep,.a-drip,.a-spin,.a-blip,.a-beam,.a-bob{animation:none}}
/* ====================== v3: CORRAL Y MASCOTAS ====================== */
:root{
  --gold:#B8860B; --coin:#C98A12; --coin-soft:#F6E7C4;
  --st-radiante:#0B7A86; --st-contenta:#2F8A3C; --st-normal:#6D808A; --st-flaca:#CC6A17; --st-enferma:#B3362D;
  --bg-radiante:#F5EBCB; --bg-contenta:#DFF0DD; --bg-normal:#E4EAED; --bg-flaca:#F9E4CE; --bg-enferma:#F6DEDB;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --gold:#E3B341; --coin:#E3B341; --coin-soft:#3A2D0E;
  --st-radiante:#45BCC6; --st-contenta:#6CC27A; --st-normal:#8FA4AD; --st-flaca:#F09A4A; --st-enferma:#E0756A;
  --bg-radiante:#3A2F12; --bg-contenta:#143321; --bg-normal:#1D2D33; --bg-flaca:#3A2512; --bg-enferma:#381B18;
}}
:root[data-theme="dark"]{
  --gold:#E3B341; --coin:#E3B341; --coin-soft:#3A2D0E;
  --st-radiante:#45BCC6; --st-contenta:#6CC27A; --st-normal:#8FA4AD; --st-flaca:#F09A4A; --st-enferma:#E0756A;
  --bg-radiante:#3A2F12; --bg-contenta:#143321; --bg-normal:#1D2D33; --bg-flaca:#3A2512; --bg-enferma:#381B18;
}
[data-st="radiante"]{--sc:var(--st-radiante);--sb:var(--bg-radiante)}
[data-st="contenta"]{--sc:var(--st-contenta);--sb:var(--bg-contenta)}
[data-st="normal"]{--sc:var(--st-normal);--sb:var(--bg-normal)}
[data-st="flaca"]{--sc:var(--st-flaca);--sb:var(--bg-flaca)}
[data-st="enferma"]{--sc:var(--st-enferma);--sb:var(--bg-enferma)}

.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.userchip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px}
.userchip:hover{border-color:var(--accent)}
.userchip b{font-size:13px;font-weight:600;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.userchip .pm{width:28px;height:28px;border-radius:50%;background:var(--sb);display:grid;place-items:center;overflow:hidden;flex:none}
.userchip .pm svg{width:34px;height:36px;margin-top:3px}

/* mascotas */
.pet{display:block;width:100%;height:auto;overflow:visible}
.pet .pg{transform-box:fill-box;transform-origin:50% 100%}
.pet.s-radiante .pg{animation:hop 1.25s ease-in-out infinite}
.pet.s-contenta .pg{animation:breathe 3.2s ease-in-out infinite}
.pet.s-normal .pg{animation:breathe 4.6s ease-in-out infinite}
.pet.s-flaca .pg{animation:slump 5.2s ease-in-out infinite}
.pet.s-enferma .pg{animation:shiver .42s linear infinite}
.pet .spk{transform-box:fill-box;transform-origin:center;animation:twinkle 1.7s ease-in-out infinite}
.pet .spk.s2{animation-delay:.5s} .pet .spk.s3{animation-delay:1s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.99,1.02)}60%{transform:translateY(0) scale(1.02,.98)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
@keyframes slump{0%,100%{transform:translateY(0)}50%{transform:translateY(2px) scale(1,.99)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-.7px)}75%{transform:translateX(.7px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.pet .pg,.pet .spk{animation:none}}

/* banner del corral */
.banner{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:16px}
.banner h2{font-size:23px;font-weight:800;letter-spacing:-.035em}
.banner p{margin:3px 0 12px;color:var(--fg-dim);font-size:13.5px}
.meter{display:flex;gap:5px}
.meter i{flex:1;height:11px;border-radius:99px;background:var(--sc);display:block;position:relative}
.meter i[title]{cursor:default}
.metrow{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--fg-mute);margin-top:8px;flex-wrap:wrap}
.legend{display:flex;gap:11px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block}

.pens{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:680px){.pens{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.pen{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:9px 9px 12px;box-shadow:var(--shadow);transition:.16s;min-width:0}
.pen:hover{transform:translateY(-3px);border-color:var(--sc)}
.pen.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.stage{background:radial-gradient(120% 90% at 50% 100%,var(--sb),transparent 78%),var(--sb);border-radius:13px;padding:8px 14px 0;display:grid;place-items:center;overflow:hidden}
.stage .pet{max-width:150px}
.pen .pn{display:block;font-family:var(--f-disp);font-weight:800;font-size:16.5px;letter-spacing:-.025em;margin:9px 4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen .own{display:block;font-size:12px;color:var(--fg-mute);margin:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 4px 0;flex-wrap:wrap}
.pen .say{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--fg-dim);font-style:italic;line-height:1.35;margin:7px 4px 0}
.stpill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sb);color:var(--sc);white-space:nowrap}
.stpill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.cnt{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.cnt svg{width:14px;height:14px}
.cnt.star{color:var(--brass)} .cnt.coin{color:var(--coin)}

/* mi mascota */
.me-top{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:16px}
@media(min-width:760px){.me-top{grid-template-columns:minmax(240px,320px) 1fr;align-items:start}}
.bigstage{border-radius:22px;background:radial-gradient(120% 90% at 50% 100%,var(--sb),transparent 80%),var(--sb);border:1px solid var(--line);padding:12px 16px 4px;position:relative;display:grid;place-items:center}
.bigstage .pet{max-width:176px}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:13.5px;font-style:italic;color:var(--fg-dim);align-self:start;max-width:92%;margin:0 0 6px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.me-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.namerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.namerow h2{font-size:27px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.namerow .sub{font-size:13px;color:var(--fg-mute);width:100%}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg-dim)}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{padding:11px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:11px}
.tl .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.tl .ico svg{width:20px;height:20px}
.tl.star .ico{background:var(--brass-soft);color:var(--brass)} .tl.coin .ico{background:var(--coin-soft);color:var(--coin)}
.tl b{display:block;font-family:var(--f-disp);font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.tl span{font-size:11.5px;color:var(--fg-mute)}
.emeter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 11px}
.emeter .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.emeter .top b{font-size:13.5px}
.ebar{height:13px;border-radius:99px;background:var(--line-soft);position:relative;overflow:hidden}
.ebar i{position:absolute;inset:0 auto 0 0;background:var(--sc);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ebar u{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.ezones{display:flex;font-size:10.5px;color:var(--fg-mute);margin-top:5px}
.ezones span{text-align:center;overflow:hidden;white-space:nowrap}
.ehint{font-size:12px;color:var(--fg-mute);margin-top:7px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);flex-wrap:wrap}
.alert.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.alert b{color:var(--fg)} .alert p{margin:0;font-size:13px;flex:1;min-width:180px;color:var(--fg-dim)}
.alert .btn{flex:none}
.btn.coin{background:var(--coin);color:#1b1304}
.hubgrid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.hubgrid{grid-template-columns:repeat(4,1fr)}}
.hubbtn{--c:var(--accent);position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:18px 12px 15px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:.17s;overflow:hidden}
.hubbtn::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
.hubbtn:hover{transform:translateY(-4px);border-color:var(--c)}
.hubbtn .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 6px 16px -6px var(--c)}
.hubbtn .ic svg{width:27px;height:27px}
.hubbtn h3{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.hubbtn .sb{font-size:11.5px;color:var(--fg-mute);line-height:1.35}
.hubbtn .bdg{position:absolute;top:10px;right:10px}
.nextup{margin-top:18px}
.nextup h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute);margin-bottom:9px}
.nrow{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:13px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;text-align:left;transition:.14s}
.nrow:hover{border-color:var(--accent);transform:translateX(2px)}
.nrow .mini{width:44px;height:38px;display:grid;place-items:center;flex:none;overflow:hidden}
.nrow .mini svg{width:52px;height:42px}
.nrow .t{flex:1;min-width:0}
.nrow .t b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .t span{font-size:11.5px;color:var(--fg-mute);font-family:var(--f-mono)}
.logout{margin-top:18px;display:flex;justify-content:center}

/* PIN */
.pinbox{text-align:center;padding:6px 0 4px}
.pinbox .pm{width:110px;margin:0 auto 4px;border-radius:20px;background:var(--sb);padding:6px 10px 0}
.pinbox h3{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.pinbox p{margin:3px 0 14px;font-size:13px;color:var(--fg-mute)}
.dots{display:flex;gap:13px;justify-content:center;margin-bottom:6px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);transition:.12s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pinerr{min-height:20px;font-size:12.5px;color:var(--bad);font-weight:600;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}
.pad button{height:54px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-disp);font-weight:700;font-size:21px}
.pad button:hover{border-color:var(--accent)} .pad button:active{background:var(--accent-soft)}
.pad button.ghost{background:transparent;border-color:transparent;font-size:15px;color:var(--fg-mute)}

/* editar mascota, tienda */
.petprev{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--sb);margin-bottom:14px}
.petprev .pm{width:104px;flex:none}
.spgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spopt{border:2px solid transparent;border-radius:14px;background:var(--surface-2);padding:4px 2px 6px;text-align:center;font-size:11px;font-weight:600;color:var(--fg-mute)}
.spopt .pet{max-width:62px;margin:0 auto}
.spopt[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.colgrid{display:flex;gap:9px;flex-wrap:wrap}
.colopt{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colopt[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:8px 8px 11px;display:flex;flex-direction:column;gap:6px;text-align:center}
.item .stage{padding:4px 10px 0}
.item .stage .pet{max-width:92px}
.item b{font-size:13.5px}
.item .price{font-family:var(--f-mono);font-size:12.5px;color:var(--coin);font-weight:600;display:inline-flex;gap:4px;align-items:center;justify-content:center}
.item .price svg{width:13px;height:13px}
.item .btn{padding:8px 10px;font-size:13px}
.item .own{font-size:11.5px;color:var(--ok);font-weight:600}

/* ranking */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:end;margin-bottom:16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;min-width:0}
.pod .stage{width:100%;padding:6px 8px 0}
.pod .stage .pet{max-width:84px}
.pod.first{padding-top:16px;border-color:var(--brass)}
.pod.first .stage .pet{max-width:104px}
.pod .rk{font-family:var(--f-disp);font-weight:800;font-size:12px;color:var(--fg-mute);letter-spacing:.08em}
.pod.first .rk{color:var(--brass)}
.pod b{font-size:13px;font-weight:700;line-height:1.2;word-break:break-word}
.pod span.o{font-size:11.5px;color:var(--fg-mute)}
.lead{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:9px 14px 9px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.lrow.me{border-color:var(--accent);background:var(--accent-soft)}
.lrow .pos{font-family:var(--f-disp);font-weight:800;font-size:16px;width:24px;text-align:center;color:var(--fg-mute);flex:none}
.lrow .pm{width:46px;height:46px;border-radius:13px;background:var(--sb);overflow:hidden;flex:none;display:grid;place-items:center}
.lrow .pm svg{width:52px;height:56px;margin-top:6px}
.lrow .nm{flex:1;min-width:0} .lrow .nm b{display:block;font-size:14.5px;font-weight:600}
.lrow .nm span{font-size:11.5px;color:var(--fg-mute)}
.lrow .pts{font-family:var(--f-mono);font-weight:600;font-size:16px;text-align:right;flex:none;color:var(--brass)}
.lrow .pts span{display:block;font-size:10.5px;color:var(--fg-mute);font-weight:400}

/* ajustes */
.prow2{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.prow2 .pm{width:46px;height:46px;border-radius:13px;background:var(--sb);overflow:hidden;flex:none;display:grid;place-items:center}
.prow2 .pm svg{width:52px;height:56px;margin-top:6px}
.prow2 .nm{flex:1;min-width:0} .prow2 .nm b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow2 .nm span{font-size:11.5px;color:var(--fg-mute)}
.prow2 select{max-width:48%;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-top:12px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* resultado de verificación */
.reward{text-align:center}
.reward .stage{max-width:230px;margin:0 auto 12px}
.reward h3{font-size:22px;font-weight:800;letter-spacing:-.03em}
.reward p{color:var(--fg-dim);font-size:13.5px;margin:5px auto 12px;max-width:34ch}
.gain{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.gain span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line)}
.gain svg{width:15px;height:15px}
.gain .g-coin{color:var(--coin)} .gain .g-star{color:var(--brass)} .gain .g-eat{color:var(--ok)}

/* ruta 5S (vista previa) */

/* ajustes finales de la estructura */
.demo{border-radius:10px;border:1px solid var(--line);margin-bottom:14px;padding:7px 12px;line-height:1.4}
.userchip[hidden]{display:none}
#app{grid-template-rows:auto 1fr}

/* ---------- Equipos EIME (capa de administrador) ---------- */
.eqrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;align-items:center;padding:10px 12px;
  border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
@media(max-width:560px){ .eqrow{grid-template-columns:minmax(0,1fr) auto}
  .eqrow .nm{grid-column:1/-1} .eqrow select{grid-column:1} }
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;
  font-size:12.5px;font-weight:600;color:var(--fg-dim);white-space:nowrap}
.chips .chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.eqrow.bloqueado{background:var(--warn-soft);border-color:var(--warn)}
.eqrow.baja{border-style:dashed}
.eqrow.baja .nm b{text-decoration:line-through;color:var(--fg-mute)}
.eqrow .nm{min-width:0}
.eqrow .nm b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.eqrow .nm span{font-size:11.5px;color:var(--fg-mute)}
.eqrow .selloEq{display:block;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--warn)}
.eqrow.baja .selloEq{color:var(--bad)}
.eqrow select{width:100%;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:13px}
.icons{display:flex;gap:5px;justify-content:flex-end}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg-dim);cursor:pointer;padding:0;flex:none}
.ib:hover{border-color:currentColor}
.ib.warn{color:var(--warn);border-color:var(--warn)}
.ib.bad{color:var(--bad);border-color:var(--bad)}
.ib.ok{color:var(--ok);border-color:var(--ok)}
.ptrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.ptrow.p1{grid-template-columns:minmax(0,1fr) auto}
.ptrow.hd{font-size:11px;color:var(--fg-mute);font-weight:600;margin-bottom:2px}
.ptrow .inp{padding:8px 9px;font-size:13.5px}
.motivos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.motivos button{font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--fg-dim);cursor:pointer}
.motivos button:hover{border-color:var(--accent);color:var(--accent-d)}
.hist{display:grid;gap:5px;font-size:12.5px;color:var(--fg-dim);margin-top:16px;
  border-top:1px solid var(--line-soft);padding-top:12px}
.hist div{display:flex;gap:9px}
.hist time{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-mute);flex:none}

/* ---------- Marca ---------- */
.logo{background:none;box-shadow:none;border-radius:9px;overflow:hidden}
.logo svg{width:31px;height:31px;display:block}

/* ---------- Emergencias (Ajustes) ---------- */
.emgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.emcard{--c:var(--accent);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--c);flex-wrap:wrap}
.emcard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.emcard .ic svg{width:22px;height:22px}
.emcard .tx{flex:1;min-width:150px;display:grid;gap:1px}
.emcard .tx b{font-size:14.5px}
.emcard .tx span{font-size:12.5px;color:var(--fg-mute)}
.emcard[data-s="on"]{background:var(--warn-soft);border-color:var(--warn);border-left-color:var(--c)}
.emcard[data-s="on"] .tx span{color:var(--fg-dim)}
.emcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.emban{margin-bottom:12px}

/* ---------- Calendario ---------- */
.cal{display:grid;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head b{font-size:16px;font-weight:700;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 0}
.cal-w{font-size:11px;font-weight:700;color:var(--fg-mute);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal-d{height:42px;border-radius:0;font-size:14px;font-weight:600;color:var(--fg);position:relative;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal-d.vacio{pointer-events:none}
.cal-d span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.cal-d:hover span{background:var(--surface-2)}
.cal-d.hoy span{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.rango{background:var(--accent-soft)}
.cal-d.ini{background:linear-gradient(90deg,transparent 50%,var(--accent-soft) 50%)}
.cal-d.fin{background:linear-gradient(90deg,var(--accent-soft) 50%,transparent 50%)}
.cal-d.ini.fin{background:none}
.cal-d.ini span,.cal-d.fin span{background:var(--accent);color:#fff}
.cal-res{display:flex;gap:8px;flex-wrap:wrap}
.cal-res .box{flex:1;min-width:120px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.cal-res .box span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute);font-weight:600}
.cal-res .box b{font-size:15px}
.cal-quick{display:flex;gap:6px;flex-wrap:wrap}
.cal-quick button{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--fg-dim);background:var(--surface)}
.cal-quick button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Zonas 5S: editor ---------- */
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.ptabs button{flex:none;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg-dim)}
.ptabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.zbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.zbar .sp{flex:1}
.zcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ztool{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--surface-2);min-height:46px}
.ztool p{margin:0;font-size:13px;color:var(--fg-dim);display:flex;gap:7px;align-items:center}
.zt{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--fg)}
.zt svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d)}
.zt.main{background:var(--accent);border-color:var(--accent);color:#fff}
.zt.bad{color:var(--bad);border-color:var(--bad)}
.zt[disabled]{opacity:.4;pointer-events:none}
.zhint{margin:0;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-mute)}
.zhint:empty{display:none}
.zcanvas{position:relative;background:var(--surface-2)}
.zcanvas svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.z-grid{stroke:var(--line);stroke-width:1;fill:none}
.z-cont{fill:var(--surface);stroke:var(--fg-mute);stroke-width:3;stroke-linejoin:round}
.z-cont.sel{stroke:var(--accent)}
.z-g{cursor:pointer}
.z-sh{stroke-width:1.6;stroke-linejoin:round}
.z-sh.vacia{fill:var(--surface-2);stroke:var(--fg-mute);stroke-dasharray:5 4}
.z-g.sel .z-sh{stroke-width:3.4;stroke:var(--fg)}
.z-lb{font:700 11.5px var(--f-body);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.z-lb.sub{font-size:9px;font-weight:500;opacity:.9}
.z-hd{fill:var(--surface);stroke:var(--accent);stroke-width:2;cursor:nwse-resize}
.z-vx{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:move}
.z-dim{opacity:.28}
.z-tl{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.z-tp{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.z-me .z-sh{stroke:var(--fg);stroke-width:4}
.z-otra .z-sh{fill:var(--surface-2);stroke:var(--line)}
.z-otra .z-lb{fill:var(--fg-mute)}
.zempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px;text-align:center}
.zempty span{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--fg-mute);max-width:300px}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line)}
.zrow:last-child{border-bottom:0}
.zrow.head{background:var(--surface-2);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-mute);font-weight:600;padding-block:7px}
.zrow small{display:block;font-size:11px;color:var(--fg-mute);font-weight:400}
.zrow .inp{padding:7px 9px;font-size:13px}
@media(max-width:560px){.zrow{grid-template-columns:minmax(0,1fr) 120px auto}}
.zchip{display:inline-flex;align-items:center;gap:6px}
.zchip i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.respgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.respbtn{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);text-align:left;font-weight:600;font-size:13.5px}
.respbtn i{width:15px;height:15px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.respbtn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.imgout{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.ztip{position:fixed;z-index:80;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:220px}

function estadoDe(energia,enferma){
  if(enferma||energia<=0) return "enferma";
  if(energia>=75) return "radiante";
  if(energia>=50) return "contenta";
  if(energia>=33) return "normal";
  return "flaca";
}
function mixc(a,b,t){
  const nz=h=>{h=h.replace("#","");return h.length===3?h.split("").map(c=>c+c).join(""):h;};
  const pa=nz(a), pb=nz(b);
  const f=i=>Math.round(parseInt(pa.substr(i,2),16)*(1-t)+parseInt(pb.substr(i,2),16)*t);
  return "#"+[0,2,4].map(i=>f(i).toString(16).padStart(2,"0")).join("");
}

  if(usando.includes("pajarita")){
    const ny=hy+hh+1;
    over+=`<path d="M60 ${ny}L${60-14} ${ny-8}V${ny+8}ZM60 ${ny}L${60+14} ${ny-8}V${ny+8}Z" fill="#C2312F"/><circle cx="60" cy="${ny}" r="3.8" fill="#8E2220"/>`;

  if(usando.includes("casco")){
    over+=`<path d="M${hx0+1} ${top+10}Q${hx0+2} ${top-17} 60 ${top-18}Q${hx1-2} ${top-17} ${hx1-1} ${top+10}Z" fill="#F4B400"/><rect x="${hx0-4}" y="${top+8}" width="${2*hw+8}" height="6.5" rx="3.2" fill="#D99A00"/><rect x="55.5" y="${top-17}" width="9" height="13" rx="2.5" fill="#FFD24D"/>`;

  }

  const shadow=`<ellipse cx="60" cy="${by+bh+3}" rx="${34+f*4}" ry="4.2" fill="#000" opacity=".13"/>`;

}

/* ====================== ZONAS 5S: planos por área ======================
   Editor del administrador (diseñar, asignar, ver como colaborador) y
   vista del colaborador. Los cambios se guardan solos unos segundos
   después de tocar el plano, y también al cambiar de plano.
   ====================================================================== */
const COLOR5S={ad:"#0B6B74",ag:"#8E74C6",de:"#C9638A",fc:"#D39A5A",jl:"#5FA37A",kr:"#6C9AC2"};
const PAL5S=["#E0643C","#3F8F5A","#7D5BC0","#C79A1E","#2E7FC1","#B24A7A","#6E8B2F","#D1574F"];
function col5(uid){ if(COLOR5S[uid]) return COLOR5S[uid];
  const i=DB.usuarios.findIndex(u=>u.id===uid); return PAL5S[(i<0?0:i)%PAL5S.length]; }
const personas5=()=>activos().map(u=>({id:u.id,n:primer(u.nombre),c:col5(u.id)}));
const pers5=id=>personas5().find(p=>p.id===id);

const Z_IC={
  contorno:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
  cuadro:'<rect x="4" y="4" width="16" height="16" rx="2"/>',
  circulo:'<circle cx="12" cy="12" r="9"/>',
  poligono:'<path d="M12 3l8 6-3 10H7L4 9z"/>',
  tag:'<path d="M20.59 13.41L13 21l-9-9V4h8l8.59 8.41a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  ojo:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
const zic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${Z_IC[n]}</svg>`;

const zUid=()=>Math.random().toString(36).slice(2,9);
const zSnap=v=>Math.round(v/10)*10;
const zClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const zDist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const zPtoOk=p=>!!p&&isFinite(p.x)&&isFinite(p.y);
const zPts=pts=>(pts||[]).filter(zPtoOk).map(p=>`${p.x},${p.y}`).join(" ");
const zTipoNom={rect:"Cuadro",circ:"Círculo",poly:"Polígono"};
const zSleep=ms=>new Promise(r=>setTimeout(r,ms));
function zContraste(hex){
  const h=hex.replace("#",""), r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)/255>0.62?"#13212A":"#FFFFFF";
}
function zCentro(z){
  if(z.tipo==="rect") return {x:z.x+z.w/2,y:z.y+z.h/2};
  if(z.tipo==="circ") return {x:z.cx,y:z.cy};
  const p=(z.pts||[]).filter(zPtoOk), n=p.length||1;
  return {x:p.reduce((s,q)=>s+q.x,0)/n,y:p.reduce((s,q)=>s+q.y,0)/n};
}
const planosDB=()=>(DB&&DB.planos5s)||[];

/* ---------- estado del editor ---------- */
let ZP=null, ZID="";                       // plano en edición (copia de trabajo)
const ZS={t:null,busy:false,dirty:false,err:""};
let zmodo="diseno", zher="", zsel="", zver="", zdib=null, zdrag=null;
function zOcupado(){ return !!(zdrag||zdib); }

function zNombrePorDefecto(tipo){ return `${zTipoNom[tipo]} ${ZP.zonas.filter(z=>z.tipo===tipo).length+1}`; }

/* ---------- guardado automático ---------- */
function zCambio(){
  ZS.dirty=true; ZS.err=""; zEstado();
  clearTimeout(ZS.t); ZS.t=setTimeout(zGuardar,2500);
}
async function zGuardar(){
  clearTimeout(ZS.t);
  if(!ZP||!ZS.dirty||ZS.busy) return !ZS.dirty;
  ZS.busy=true; ZS.err=""; ZS.dirty=false; zEstado();
  const r=await call("guardarPlano5s",{plano:JSON.parse(JSON.stringify(ZP))});
  ZS.busy=false;
  if(!r.ok){ ZS.dirty=true; ZS.err=r.msg||"No se pudo guardar"; zEstado(); toast(ZS.err,"!"); return false; }
  if(ZS.dirty){ clearTimeout(ZS.t); ZS.t=setTimeout(zGuardar,400); }
  zEstado(); return true;
}
/* espera a que no quede nada pendiente; devuelve false si no se pudo guardar */
async function zFlush(){
  for(let i=0;i<60;i++){
    if(ZS.busy){ await zSleep(150); continue; }
    if(!ZS.dirty) return true;
    const ok=await zGuardar(); if(!ok&&ZS.err) return false;
  }
  return !ZS.dirty;
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&ZS.dirty) zGuardar(); });
function zEstado(){
  const el=$("#zEstado"), b=$("#zGuardarBtn"); if(!el) return;
  const [t,k]=ZS.busy?["Guardando…","warn"]:ZS.err?["No se pudo guardar","bad"]:ZS.dirty?["Cambios sin guardar","warn"]:["Guardado ✓","ok"];
  el.className="pill "+k; el.textContent=t;
  if(b) b.hidden=!(ZS.dirty||ZS.err);
}

/* ---------- pantalla del administrador ---------- */
function vZonas(){
  if(!planosDB().length&&!ZP) return `<div class="empty">Aún no hay planos de zonas 5S.<br><br>
    <button class="btn" data-act="zBase">Cargar los 6 planos aprobados</button>
    <button class="btn ghost" data-act="zNuevo">Crear un plano en blanco</button></div>`;
  return `<div class="ptabs" id="zTabs"></div>
    <div class="zbar"><span id="zEstado" class="pill ok">Guardado ✓</span>
      <button class="btn sm" id="zGuardarBtn" data-act="zGuardar" hidden>Guardar ahora</button><span class="sp"></span>
      <button class="btn ghost sm" data-act="zNuevo">${ic("plus",15)} Plano nuevo</button>
      <button class="btn ghost sm" data-act="zRenPlano">Renombrar</button>
      <button class="btn ghost sm" data-act="zDelPlano" style="color:var(--bad)">Eliminar</button></div>
    <div class="chips" id="zChips" style="margin-bottom:10px"></div>
    <div class="tabs" id="zModos" style="display:inline-flex;margin-bottom:10px"></div>
    <div id="zVerWrap" hidden style="margin-bottom:10px;display:none"><label class="fl" for="zVer">Ver como</label><select class="inp" id="zVer"></select></div>
    <div class="zcard"><div class="ztool" id="zTool"></div><p class="zhint" id="zHint"></p>
      <div class="zcanvas"><svg id="zSvg" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"></svg><div class="zempty" id="zEmpty" hidden><span></span></div></div></div>
    <div class="zcard"><div id="zRows"></div></div>
    <div class="toolrow"><button class="btn" data-act="zImagen">Imagen para imprimir</button></div>
    <div class="note">Cada plano es un área o departamento. «Diseño» dibuja y mueve las zonas, «Asignar» elige quién cuida cada una (la zona se pinta con su color) y «Vista colaborador» muestra lo que ve esa persona el día de 5S. Los cambios se guardan solos.</div>`;
}

function zInit(){
  if(!$("#zSvg")) return;
  const L=planosDB(); if(!L.length&&!ZP) return;
  if(!(ZS.dirty||ZS.busy)){
    const id=L.some(p=>p.id===ZID)?ZID:(L[0]&&L[0].id);
    if(id){ ZID=id; ZP=JSON.parse(JSON.stringify(L.find(p=>p.id===id))); }
  }
  if(!ZP) return;
  if(zsel&&zsel!=="contorno"&&!ZP.zonas.some(z=>z.id===zsel)) zsel="";
  if(!zver||!pers5(zver)) zver=(personas5()[0]||{}).id||"";
  zRenderAll();
}
function zRenderAll(){
  for(const f of [zTabs,zChips,zModos,zTool,zPlano,zRows,zEstado]){
    try{ f(); }catch(e){ console.error(f.name,e); }
  }
}
function zTabs(){
  const L=planosDB().map(p=>p.id===ZID?Object.assign({},p,{nombre:ZP.nombre}):p);
  if(!L.some(p=>p.id===ZID)) L.push({id:ZID,nombre:ZP.nombre});
  $("#zTabs").innerHTML=L.map(p=>`<button data-act="zIr" data-id="${p.id}" aria-pressed="${p.id===ZID}">${esc(p.nombre)}</button>`).join("");
}
function zChips(){
  const z=ZP.zonas, asig=z.filter(x=>pers5(x.resp)).length;
  $("#zChips").innerHTML=`<span class="chip">Zonas <b>${z.length}</b></span><span class="chip">Asignadas <b>${asig}</b></span><span class="chip">Sin asignar <b>${z.length-asig}</b></span>`+
    personas5().map(p=>`<span class="chip zchip"><i style="background:${p.c}"></i>${esc(p.n)} <b>${z.filter(x=>x.resp===p.id).length}</b></span>`).join("");
}
function zModos(){
  const M=[["diseno","Diseño"],["asignar","Asignar"],["vista","Vista colaborador"]];
  $("#zModos").innerHTML=M.map(([k,l])=>`<button data-act="zModo" data-m="${k}" aria-pressed="${zmodo===k}">${l}</button>`).join("");
  const w=$("#zVerWrap"); w.hidden=zmodo!=="vista"; w.style.display=zmodo==="vista"?"block":"none";
  if(zmodo==="vista"){
    $("#zVer").innerHTML=personas5().map(p=>`<option value="${p.id}" ${p.id===zver?"selected":""}>${esc(p.n)}</option>`).join("");
    $("#zVer").onchange=e=>{ zver=e.target.value; zRenderAll(); };
  }
}
function zTool(){
  const tb=$("#zTool"), hint=$("#zHint");
  if(zdib){
    const n=zdib.pts.length;
    tb.innerHTML=`<span class="chip" style="border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600">Puntos: <b>${n}</b></span>
      <button class="zt main" data-act="zCerrar" ${n<3?"disabled":""}>Cerrar forma</button><button class="zt" data-act="zCancelar">Cancelar</button>`;
    hint.textContent=zdib.tipo==="contorno"?"Toca las esquinas del área en orden. Cierra tocando cerca del primer punto.":"Toca las esquinas de la zona en orden. Cierra tocando cerca del primer punto.";
    return;
  }
  if(zmodo==="diseno"){
    const hay=!!ZP.contorno; let extra="";
    if(zsel==="contorno") extra=`<button class="zt" data-act="zRehacerC">Rehacer borde</button><button class="zt bad" data-act="zBorrarC">${zic("trash")} Eliminar borde</button>`;
    else if(zsel) extra=`<button class="zt" data-act="zRenZona">${zic("tag")} Renombrar</button><button class="zt" data-act="zDup">Duplicar</button><button class="zt bad" data-act="zBorrarZ">${zic("trash")} Eliminar</button>`;
    tb.innerHTML=`<button class="zt" data-act="zHer" data-h="contorno" ${hay?"disabled":""} aria-pressed="${zher==="contorno"}">${zic("contorno")} Borde del área</button>
      <button class="zt" data-act="zHer" data-h="rect" aria-pressed="${zher==="rect"}">${zic("cuadro")} Zona cuadrada</button>
      <button class="zt" data-act="zHer" data-h="circ" aria-pressed="${zher==="circ"}">${zic("circulo")} Zona circular</button>
      <button class="zt" data-act="zHer" data-h="poly" aria-pressed="${zher==="poly"}">${zic("poligono")} Zona libre</button>${extra}`;
    hint.textContent=zsel?"Arrastra la zona para moverla, o el cuadrito de la esquina para cambiar su tamaño."
      :zher==="rect"||zher==="circ"?"Toca el plano donde quieras poner la zona.":"Elige una herramienta y toca el plano. «Borde del área» dibuja el límite del espacio (una sola vez).";
  }else if(zmodo==="asignar"){
    tb.innerHTML=`<p>${zic("tag")} Toca una zona para asignarle un responsable.</p>`; hint.textContent="";
  }else{
    tb.innerHTML=`<p>${zic("ojo")} Así se ve el plano el día que a <b>${esc((pers5(zver)||{}).n||"")}</b> le toque 5S.</p>`; hint.textContent="";
  }
}

/* ---------- el plano (SVG) ---------- */
function zSvgPt(evt){
  const svg=$("#zSvg"), pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:p.x,y:p.y};
}
function zPlano(){
  const svg=$("#zSvg"); if(!svg||!ZP) return;
  const hay=ZP.contorno||ZP.zonas.length||zdib;
  $("#zEmpty").hidden=!!hay;
  if(!hay) $("#zEmpty span").textContent="Plano vacío. Con «Zona cuadrada», «Zona circular» o «Zona libre» agregas las zonas; «Borde del área» dibuja el límite del espacio.";
  let h=`<defs><pattern id="zgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="z-grid"/></pattern></defs><rect width="900" height="600" fill="url(#zgrid)"/>`;
  if(ZP.contorno){
    const sc=zsel==="contorno";
    h+=`<polygon class="z-cont ${sc?"sel":""}" id="zCont" points="${zPts(ZP.contorno)}"/>`;
    if(sc&&zmodo==="diseno") h+=ZP.contorno.map((p,i)=>`<circle class="z-vx" data-vc="${i}" cx="${p.x}" cy="${p.y}" r="8"/>`).join("");
  }
  h+=ZP.zonas.map(z=>{
    const p=pers5(z.resp), asig=!!p, dim=zmodo==="vista"&&zver&&z.resp!==zver;
    const fill=asig?p.c:null, txt=asig?zContraste(p.c):"var(--fg-dim)", sel=z.id===zsel&&zmodo==="diseno";
    const fa=fill?`fill="${fill}" stroke="${fill}"`:"";
    let sh="", hd="";
    if(z.tipo==="rect"){ sh=`<rect class="z-sh ${asig?"":"vacia"}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="9" ${fa}/>`;
      if(sel) hd=`<rect class="z-hd" data-h="rect" x="${z.x+z.w-10}" y="${z.y+z.h-10}" width="20" height="20" rx="5"/>`; }
    else if(z.tipo==="circ"){ sh=`<circle class="z-sh ${asig?"":"vacia"}" cx="${z.cx}" cy="${z.cy}" r="${z.r}" ${fa}/>`;
      if(sel) hd=`<circle class="z-hd" data-h="circ" cx="${z.cx+z.r}" cy="${z.cy}" r="10"/>`; }
    else { sh=`<polygon class="z-sh ${asig?"":"vacia"}" points="${zPts(z.pts)}" ${fa}/>`;
      if(sel) hd=(z.pts||[]).map((q,i)=>`<circle class="z-vx" data-h="poly" data-i="${i}" cx="${q.x}" cy="${q.y}" r="8"/>`).join(""); }
    const c=zCentro(z);
    return `<g class="z-g ${sel?"sel":""} ${dim?"z-dim":""}" data-id="${z.id}">${sh}<text class="z-lb" x="${c.x}" y="${c.y-6}" fill="${txt}">${esc(z.n)}</text><text class="z-lb sub" x="${c.x}" y="${c.y+9}" fill="${txt}">${asig?esc(p.n):"sin asignar"}</text>${hd}</g>`;
  }).join("");
  if(zdib&&zdib.pts.length) h+=`<polyline class="z-tl" points="${zPts(zdib.pts)}"/>`+zdib.pts.map(p=>`<circle class="z-tp" r="5" cx="${p.x}" cy="${p.y}"/>`).join("");
  svg.innerHTML=h;

  const cont=$("#zCont");
  if(cont&&zmodo==="diseno"&&!zdib){
    cont.style.cursor="pointer";
    cont.addEventListener("pointerdown",e=>{ e.stopPropagation();
      if(zsel!=="contorno"){ zsel="contorno"; zher=""; zRenderAll(); return; }
      zdrag={type:"movec",start:zSvgPt(e),orig:ZP.contorno.map(p=>({x:p.x,y:p.y}))}; });
  }
  $$("[data-vc]",svg).forEach(v=>v.addEventListener("pointerdown",e=>{ e.stopPropagation(); zdrag={type:"vc",i:+v.dataset.vc}; }));
  $$(".z-g",svg).forEach(g=>{
    const id=g.dataset.id, z0=ZP.zonas.find(z=>z.id===id);
    g.addEventListener("pointerdown",e=>{
      if(zmodo==="vista"||zdib) return;
      const t=e.target;
      if(t.dataset.h==="poly"){ e.stopPropagation(); zdrag={type:"vp",id,i:+t.dataset.i}; return; }
      if(t.dataset.h){ e.stopPropagation(); zdrag={type:"size",id,shape:t.dataset.h}; return; }
      if(zmodo==="asignar"){ e.stopPropagation(); zAbrirAsignar(id); return; }
      if(zmodo==="diseno"&&!zher){ e.stopPropagation(); zsel=id;
        zdrag={type:"move",id,start:zSvgPt(e),orig:JSON.parse(JSON.stringify(ZP.zonas.find(z=>z.id===id))),moved:false};
        zTool(); zPlano(); }
    });
    g.addEventListener("pointerenter",e=>{ if(!zdrag) zTip(e,z0); });
    g.addEventListener("pointermove",e=>{ if(!zdrag) zTipPos(e); });
    g.addEventListener("pointerleave",zTipOff);
  });
  svg.onpointerdown=e=>{
    if(zdib){
      const p=zSvgPt(e);
      if(zdib.pts.length>=3&&zDist(p,zdib.pts[0])<16){ zCerrar(); return; }
      zdib.pts.push(p); zTool(); zPlano(); return;
    }
    if(zmodo==="diseno"&&(zher==="rect"||zher==="circ")){
      const p=zSvgPt(e);
      const z=zher==="rect"
        ?{id:zUid(),tipo:"rect",x:zSnap(zClamp(p.x-70,10,750)),y:zSnap(zClamp(p.y-45,10,500)),w:140,h:90,n:zNombrePorDefecto("rect"),resp:""}
        :{id:zUid(),tipo:"circ",cx:zSnap(zClamp(p.x,70,830)),cy:zSnap(zClamp(p.y,70,530)),r:60,n:zNombrePorDefecto("circ"),resp:""};
      ZP.zonas.push(z); zsel=z.id; zher=""; zCambio(); zRenderAll(); zAbrirNombre(z.id); return;
    }
    if(!e.target.closest(".z-g")&&!e.target.closest("#zCont")){ if(zsel){ zsel=""; zTool(); zPlano(); } }
  };
  svg.onpointermove=e=>{
    if(!zdrag) return; const p=zSvgPt(e), d=zdrag;
    if(d.type==="move"){
      const z=ZP.zonas.find(z=>z.id===d.id); if(!z) return;
      const dx=p.x-d.start.x, dy=p.y-d.start.y; if(Math.abs(dx)+Math.abs(dy)>2) d.moved=true;
      if(z.tipo==="rect"){ z.x=zSnap(zClamp(d.orig.x+dx,10,890-z.w)); z.y=zSnap(zClamp(d.orig.y+dy,10,590-z.h)); }
      else if(z.tipo==="circ"){ z.cx=zSnap(zClamp(d.orig.cx+dx,10+z.r,890-z.r)); z.cy=zSnap(zClamp(d.orig.cy+dy,10+z.r,590-z.r)); }
      else z.pts=d.orig.pts.map(q=>({x:zSnap(q.x+dx),y:zSnap(q.y+dy)}));
    }else if(d.type==="size"){
      const z=ZP.zonas.find(z=>z.id===d.id); if(!z) return; d.moved=true;
      if(d.shape==="rect"){ z.w=zSnap(zClamp(p.x-z.x,50,890-z.x)); z.h=zSnap(zClamp(p.y-z.y,40,590-z.y)); }
      else z.r=zSnap(zClamp(Math.hypot(p.x-z.cx,p.y-z.cy),24,270));
    }else if(d.type==="vp"){
      const z=ZP.zonas.find(z=>z.id===d.id); if(!z) return; d.moved=true;
      z.pts[d.i]={x:zSnap(zClamp(p.x,5,895)),y:zSnap(zClamp(p.y,5,595))};
    }else if(d.type==="movec"){
      d.moved=true; const dx=p.x-d.start.x, dy=p.y-d.start.y;
      ZP.contorno=d.orig.map(q=>({x:zSnap(zClamp(q.x+dx,5,895)),y:zSnap(zClamp(q.y+dy,5,595))}));
    }else if(d.type==="vc"){
      d.moved=true; ZP.contorno[d.i]={x:zSnap(zClamp(p.x,5,895)),y:zSnap(zClamp(p.y,5,595))};
    }
    zPlano();
  };
  svg.onpointerup=svg.onpointercancel=()=>{ if(!zdrag) return; const m=zdrag.moved; zdrag=null; if(m){ zCambio(); zRows(); zChips(); } };
}
function zCerrar(){
  if(!zdib||zdib.pts.length<3) return;
  if(zdib.tipo==="contorno"){ ZP.contorno=zdib.pts; zdib=null; zher=""; zCambio(); zRenderAll(); return; }
  const z={id:zUid(),tipo:"poly",pts:zdib.pts,n:zNombrePorDefecto("poly"),resp:""};
  ZP.zonas.push(z); zsel=z.id; zdib=null; zher=""; zCambio(); zRenderAll(); zAbrirNombre(z.id);
}

/* ---------- ayuda al pasar el dedo / mouse ---------- */
function zTip(e,z){
  if(!z) return; let t=$("#zTip"); if(!t){ document.body.insertAdjacentHTML("beforeend",`<div class="ztip" id="zTip"></div>`); t=$("#zTip"); }
  const p=pers5(z.resp);
  t.innerHTML=`${esc(z.n)}<small>${zTipoNom[z.tipo]} · ${p?esc(p.n):"sin responsable"}</small>`; t.hidden=false; zTipPos(e);
}
function zTipPos(e){ const t=$("#zTip"); if(!t) return; t.style.left=Math.min(e.clientX+14,innerWidth-240)+"px"; t.style.top=(e.clientY+14)+"px"; }
function zTipOff(){ const t=$("#zTip"); if(t) t.remove(); }

  openSheet(`${phead("Nombre de la zona")}<div class="pbody"><p style="margin:0 0 10px;font-size:13.5px;color:var(--fg-dim)">¿Qué es este espacio? Así lo verás siempre en el plano.</p>
    <input class="inp" id="zNom" value="${esc(z.n)}" maxlength="40"><div class="saverow"><button class="btn" id="zNomOk">${ic("chk",18)} Guardar</button></div></div>`);

  $("#zNomOk").onclick=ok; inp.onkeydown=e=>{ if(e.key==="Enter") ok(); };

function zAbrirAsignar(id){
  const z=ZP.zonas.find(z=>z.id===id); if(!z) return;
  openSheet(`${phead(esc(z.n))}<div class="pbody"><p style="margin:0 0 10px;font-size:13.5px;color:var(--fg-dim)">Elige quién es responsable de esta zona.</p>

function zDuplicar(id){
  const z=ZP.zonas.find(z=>z.id===id); if(!z) return;
  const c=JSON.parse(JSON.stringify(z)); c.id=zUid(); c.n=z.n+" (copia)";
  if(c.tipo==="rect"){ c.x=zSnap(zClamp(c.x+30,10,890-c.w)); c.y=zSnap(zClamp(c.y+30,10,590-c.h)); }
  else if(c.tipo==="circ"){ c.cx=zSnap(zClamp(c.cx+30,10+c.r,890-c.r)); c.cy=zSnap(zClamp(c.cy+30,10+c.r,590-c.r)); }
  else c.pts=c.pts.map(q=>({x:zSnap(zClamp(q.x+30,5,895)),y:zSnap(zClamp(q.y+30,5,595))}));
  ZP.zonas.push(c); zsel=c.id; zCambio(); zRenderAll();
}
function zRows(){
  const el=$("#zRows"); if(!el) return;
  const opts=z=>`<option value="">Sin asignar</option>${personas5().map(p=>`<option value="${p.id}" ${p.id===z.resp?"selected":""}>${esc(p.n)}</option>`).join("")}`;
  el.innerHTML=`<div class="zrow head"><span>Zona</span><span>Responsable</span><span></span></div>`+
    (ZP.zonas.map(z=>`<div class="zrow" data-id="${z.id}"><div><input class="inp" value="${esc(z.n)}" data-f="n" maxlength="40" aria-label="Nombre de la zona"><small>${zTipoNom[z.tipo]}</small></div>
      <select class="inp" data-f="resp" aria-label="Responsable de ${esc(z.n)}">${opts(z)}</select>
      <button class="ib bad" data-act="zDelFila" data-id="${z.id}" aria-label="Eliminar ${esc(z.n)}">${zic("trash")}</button></div>`).join("")
      ||`<div class="empty" style="border:0">Aún no hay zonas en este plano.</div>`);
  $$(".zrow[data-id]",el).forEach(row=>{
    const z=ZP.zonas.find(q=>q.id===row.dataset.id);
    row.querySelector('[data-f="n"]').onchange=e=>{ z.n=e.target.value.trim()||"Zona"; zCambio(); zPlano(); };
    row.querySelector('[data-f="resp"]').onchange=e=>{ z.resp=e.target.value; zCambio(); zChips(); zPlano(); };
  });
}

/* ---------- imagen para imprimir ---------- */
const zXml=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function zExportSVG(pl){
  const per=personas5(), vw=900, vh=600, W=1000, top=74, filas=Math.max(1,Math.ceil(per.length/4));
  const H=top+vh+28+filas*24+16, sc=(W-100)/vw;
  const fecha=new Date(nowMs()).toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"});
  const BORDE="#1C2B32";
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, Helvetica, sans-serif"><rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  s+=`<text x="24" y="32" font-size="22" font-weight="700" fill="#13212A">${zXml(pl.nombre)}</text><text x="24" y="52" font-size="12" fill="#5B6B74">Corral Lab · Zonas 5S · ${fecha}</text><line x1="24" y1="62" x2="${W-24}" y2="62" stroke="#D5DDE1"/>`;
  s+=`<g transform="translate(50,${top}) scale(${sc})">`;
  if(pl.contorno) s+=`<polygon points="${zPts(pl.contorno)}" fill="#F7FAFB" stroke="#55646C" stroke-width="3"/>`;
  pl.zonas.forEach(z=>{
    const p=pers5(z.resp), fill=p?p.c:"#E7ECEE", txt=p?zContraste(p.c):"#45535B", c=zCentro(z);
    if(z.tipo==="rect") s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" fill="${fill}" stroke="${BORDE}" stroke-width="2.5"/>`;
    else if(z.tipo==="circ") s+=`<circle cx="${z.cx}" cy="${z.cy}" r="${z.r}" fill="${fill}" stroke="${BORDE}" stroke-width="2.5"/>`;
    else s+=`<polygon points="${zPts(z.pts)}" fill="${fill}" stroke="${BORDE}" stroke-width="2.5"/>`;
    const nom=z.n.length>18?z.n.slice(0,17)+"…":z.n;
    s+=`<text x="${c.x}" y="${c.y-4}" font-size="15" font-weight="700" text-anchor="middle" fill="${txt}">${zXml(nom)}</text><text x="${c.x}" y="${c.y+15}" font-size="12" font-weight="700" text-anchor="middle" fill="${txt}">${p?zXml(p.n.toUpperCase()):"SIN ASIGNAR"}</text>`;
  });
  s+=`</g>`;
  let lx=24, ly=top+vh+34, col=0;
  s+=`<text x="24" y="${ly-16}" font-size="11.5" font-weight="700" letter-spacing="1" fill="#5B6B74">RESPONSABLES</text>`;
  per.forEach(p=>{
    const n=pl.zonas.filter(z=>z.resp===p.id).length;
    s+=`<rect x="${lx}" y="${ly-13}" width="15" height="15" rx="3" fill="${p.c}" stroke="${BORDE}" stroke-width="1.5"/><text x="${lx+21}" y="${ly}" font-size="13" font-weight="600" fill="#13212A">${zXml(p.n)} (${n})</text>`;
    lx+=(W-48)/4; if(++col>=4){ col=0; lx=24; ly+=26; }
  });
  return {xml:s+"</svg>",w:W,h:H};
}
function zMostrarImagen(pl){
  const {xml,w,h}=zExportSVG(pl), img=new Image();
  img.onload=()=>{
    const cv=document.createElement("canvas"); cv.width=w*3; cv.height=h*3;
    const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
    const url=cv.toDataURL("image/png");
    openSheet(`${phead("Imagen del plano")}<div class="pbody"><img class="imgout" alt="Plano ${esc(pl.nombre)}" src="${url}">
      <div class="saverow"><a class="btn" href="${url}" download="plano-5s-${esc(pl.nombre.toLowerCase().replace(/[^a-z0-9]+/g,"-"))}.png">Descargar imagen</a></div>
      <p style="margin:10px 0 0;font-size:12.5px;color:var(--fg-mute)">En el teléfono, mantén presionada la imagen para guardarla. Está en alta resolución para imprimir.</p></div>`);
  };
  img.onerror=()=>toast("No se pudo generar la imagen","!");
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
}

/* ====================== EMERGENCIAS (EIME y 5S) ======================
   El administrador activa un período para cada gestión desde Ajustes,
   eligiendo las fechas en un calendario. Sin período activo, la gestión
   queda «en espera».
   ===================================================================== */
const GESTION={eime:{n:"EIME",col:"var(--m-eime)",ico:"eime"},s5:{n:"5S",col:"var(--m-s5)",ico:"cinco"}};

function emerg(k){
  const e=DB&&DB.config&&DB.config.EMERG&&DB.config.EMERG[k];
  if(!e||!e.d||!e.h) return {st:"off"};
  const h=hoyS();
  if(h<e.d) return {st:"prog",d:e.d,h:e.h};
  if(h>e.h) return {st:"fin",d:e.d,h:e.h};
  return {st:"on",d:e.d,h:e.h,quedan:diffDias(e.h)};
}
function emergTexto(k){
  const e=emerg(k);
  if(e.st==="on") return `Activa del ${fmt(e.d)} al ${fmt(e.h)} · ${e.quedan===0?"termina hoy":e.quedan===1?"queda 1 día":`quedan ${e.quedan} días`}`;
  if(e.st==="prog") return `Programada del ${fmt(e.d)} al ${fmt(e.h)}`;
  if(e.st==="fin") return `Terminó el ${fmt(e.h)}`;
  return "Sin período activo";
}
/* aviso para todos en «Mi mascota» */
function bannerEmerg(){
  return ["eime","s5"].filter(k=>emerg(k).st==="on").map(k=>
    `<div class="alert warn emban"><p><b>Emergencia ${GESTION[k].n} activa.</b> ${emergTexto(k)}.</p></div>`).join("");
}
/* tarjetas del administrador */
function vEmergencias(){

      <div class="acts"><button class="btn sm" data-act="emerg" data-k="${k}">${hay?"Cambiar fechas":"Activar"}</button>
        ${hay?`<button class="btn ghost sm" data-act="emergFin" data-k="${k}">Terminar</button>`:""}</div></div>`;}).join("")}</div>`;
}

/* ---------- calendario ---------- */
let CAL=null;
function calMesTxt(ym){ const [y,m]=ym.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("es-CL",{month:"long",year:"numeric"}).replace(" de "," "); }
function calCuerpo(){
  const [y,m]=CAL.mes.split("-").map(Number), hoy=hoyS();
  const primero=(new Date(y,m-1,1).getDay()+6)%7, dias=new Date(y,m,0).getDate();
  let celdas=""; for(let i=0;i<primero;i++) celdas+=`<span class="cal-d vacio"></span>`;
  for(let d=1;d<=dias;d++){
    const s=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const ini=s===CAL.ini, fin=s===CAL.fin, enRango=CAL.ini&&CAL.fin&&s>CAL.ini&&s<CAL.fin;
    const marca=(ini&&fin)||(ini&&!CAL.fin)?"ini fin":ini?"ini":fin?"fin":"";
    const cls=["cal-d",s===hoy?"hoy":"",enRango?"rango":"",marca].join(" ");
    celdas+=`<button class="${cls}" data-act="calDia" data-d="${s}" aria-label="${fmt(s)}"><span>${d}</span></button>`;
  }
  const n=CAL.ini&&CAL.fin?diffDias2(CAL.ini,CAL.fin)+1:0;
  return `<div class="cal-head"><button class="ib" data-act="calMes" data-n="-1" aria-label="Mes anterior">${ic("back",16)}</button><b>${calMesTxt(CAL.mes)}</b>
      <button class="ib" data-act="calMes" data-n="1" aria-label="Mes siguiente" style="transform:scaleX(-1)">${ic("back",16)}</button></div>
    <div class="cal-grid">${["L","M","M","J","V","S","D"].map(x=>`<span class="cal-w">${x}</span>`).join("")}${celdas}</div>
    <div class="cal-quick"><button data-act="calRapido" data-n="7">1 semana</button><button data-act="calRapido" data-n="14">2 semanas</button><button data-act="calRapido" data-n="30">1 mes</button></div>
    <div class="cal-res"><div class="box"><span>Desde</span><b>${CAL.ini?fmt(CAL.ini):"—"}</b></div><div class="box"><span>Hasta</span><b>${CAL.fin?fmt(CAL.fin):"—"}</b></div>
      <div class="box"><span>Duración</span><b>${n?n+(n===1?" día":" días"):"—"}</b></div></div>`;
}
const diffDias2=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
function abrirCalendario(k){
  const e=emerg(k), hoy=hoyS();
  CAL={k,ini:e.d||null,fin:e.h||null,mes:(e.d||hoy).slice(0,7)};
  openSheet(`${phead("Emergencia "+GESTION[k].n)}<div class="pbody"><p style="margin:0 0 10px;font-size:13.5px;color:var(--fg-dim)">Toca el primer y el último día del período. Mientras dure, la gestión queda activa para todos.</p>
    <div class="cal" id="calBody"></div>
    <div class="saverow"><button class="btn" id="calOk">${ic("chk",18)} Activar período</button><button class="btn ghost" data-close>Cancelar</button></div></div>`);
  calPinta();
}
function calPinta(){ const b=$("#calBody"); if(!b) return; b.innerHTML=calCuerpo(); const ok=$("#calOk"); if(ok) ok.disabled=!(CAL.ini&&CAL.fin); }

const EACT={
  emerg(d){ abrirCalendario(d.k); },
  async emergFin(d){ const r=await call("emergencia",{gestion:d.k,desde:"",hasta:""}); if(!r.ok){ toast(r.msg,"!"); return; } render(); toast("Emergencia terminada"); },
  calMes(d){ const [y,m]=CAL.mes.split("-").map(Number), f=new Date(y,m-1+Number(d.n),1);
    CAL.mes=`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}`; calPinta(); },
  calDia(d){ const s=d.d;
    if(!CAL.ini||(CAL.ini&&CAL.fin)){ CAL.ini=s; CAL.fin=null; }
    else if(s<CAL.ini){ CAL.ini=s; }
    else CAL.fin=s;
    calPinta(); },
  calRapido(d){ const ini=CAL.ini||hoyS(); CAL.ini=ini; CAL.fin=addDays(ini,Number(d.n)-1); CAL.mes=ini.slice(0,7); calPinta(); }
};
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("#calOk"); if(!t||!CAL||!CAL.ini||!CAL.fin) return;
  t.disabled=true;
  const r=await call("emergencia",{gestion:CAL.k,desde:CAL.ini,hasta:CAL.fin});
  if(!r.ok){ t.disabled=false; toast(r.msg,"!"); return; }
  const k=CAL.k; CAL=null; closeSheet(); render(); toast("Emergencia "+GESTION[k].n+" activada");
});

function regTabla(e,vs){
  const num=!e.pasa, tem=!!e.temp;
  const cab=num
    ?["Fecha","Valor nominal (patrón)","Indicación del instrumento","Error absoluto","Error relativo (%)","Tolerancia (±)",...(tem?["Temp. (°C)"]:[]),"Resultado","Responsable","Hora","Observaciones"]
    :["Fecha","Punto verificado","Criterio","Resultado","Responsable","Hora","Observaciones"];
  const filas=[];
  vs.forEach(v=>{
    const n=v.det.length||1, resp=U(v.usuario)?.nombre||"";
    v.det.forEach((d,i)=>{
      const pt=(e.pts||[])[i], ok=d.ok?"Conforme":"No conforme";
      const comunes=i===0?`<td rowspan="${n}">${esc(resp)}</td><td rowspan="${n}">${esc(v.hora||"")}</td><td rowspan="${n}" class="rg-obs">${esc(v.obs||"")}</td>`:"";

      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);

    const r={full:out(1024,0.78),mini:out(260,0.6)}; URL.revokeObjectURL(url); ok(r); };
  img.onerror=()=>{ URL.revokeObjectURL(url); mal(new Error("No pude leer la foto")); };

/* ====================== CALENDARIO EIME Y CARRETERA ====================== */
const RUTA_INICIO="2026-10-26";
const DIAS_SEM=["dom","lun","mar","mié","jue","vie","sáb"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ultDiaMes=(y,m)=>new Date(y,m+1,0).getDate();
// último día hábil (lunes a viernes) del mes, sin pasar del día «tope»
function finHabil(y,m,tope){ let d=Math.min(tope,ultDiaMes(y,m));
  while([0,6].includes(new Date(y,m,d).getDay())) d--; return d2s(new Date(y,m,d)); }
/* Período EIME que contiene la fecha:
   mensual  → todo el mes; ventana obligatoria = las 2 últimas semanas (cierra el último día hábil)
   quincenal→ 1–15 y 16–fin; ventana = la última semana de cada quincena */
function periodoEime(freq,fecha){
  const d=parse(fecha), y=d.getFullYear(), m=d.getMonth(), dia=d.getDate();
  if(freq==="quincenal"){
    const primera=dia<=15, ini=d2s(new Date(y,m,primera?1:16)), finCal=d2s(new Date(y,m,primera?15:ultDiaMes(y,m)));
    const fin=finHabil(y,m,primera?15:31);
    return {ini,finCal,fin,abre:addDays(fin,-6),nombre:`${primera?"1ª":"2ª"} quincena de ${MESES[m]}`};
  }
  const fin=finHabil(y,m,31);
  return {ini:d2s(new Date(y,m,1)),finCal:d2s(new Date(y,m,ultDiaMes(y,m))),fin,abre:addDays(fin,-13),nombre:`${MESES[m]} ${y}`};
}
const sigPeriodo=(freq,per)=>periodoEime(freq,addDays(per.finCal,1));
const verifEn=(e,per)=>DB.verif.some(v=>v.eq===e.id&&v.fecha>=per.ini&&v.fecha<=per.finCal);

/* ---- obstáculos de la carretera ---- */
// 5S: todos los miércoles desde el inicio
function obst5S(desde,hasta){ const L=[]; let d=desde<RUTA_INICIO?RUTA_INICIO:desde;
  while(parse(d).getDay()!==3) d=addDays(d,1);
  for(;d<=hasta;d=addDays(d,7)) L.push({tipo:"5s",fecha:d,id:"5s"+d,titulo:"Gestión 5S",ini:addDays(d,-6)});
  return L; }
// EIME: cierre de cada período (mensual y quincenal, según los equipos que existan)
function obstEime(desde,hasta){
  const freqs=[...new Set(DB.equipos.filter(activoEq).map(e=>e.freq==="quincenal"?"quincenal":"mensual"))], vistos={}, L=[];
  freqs.forEach(f=>{ let per=periodoEime(f,desde<RUTA_INICIO?RUTA_INICIO:desde);
    while(per.fin<=hasta){ const k=per.fin;
      if(per.fin>=RUTA_INICIO&&!vistos[k]) { vistos[k]=1; L.push({tipo:"eime",fecha:per.fin,abre:per.abre,id:"eime"+per.fin,titulo:"Verificación EIME",f}); }
      per=sigPeriodo(f,per); } });
  return L; }
// Misión sorpresa: una por semana, en un día hábil al azar (siempre el mismo para todos); se ve 2 días antes
function hashTxt(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function obstMision(desde,hasta){ const L=[]; let lun=desde<RUTA_INICIO?RUTA_INICIO:desde;
  while(parse(lun).getDay()!==1) lun=addDays(lun,-1);
  for(;lun<=hasta;lun=addDays(lun,7)){ const d=addDays(lun,hashTxt("mision"+lun)%5);
    if(d>=RUTA_INICIO&&d>=desde&&d<=hasta) L.push({tipo:"mision",fecha:d,id:"mi"+d,titulo:"Misión sorpresa",ini:addDays(d,-2)}); }
  return L; }
const MISION_BONUS={monedas:15,estrellas:1}, RETROCESO_MONEDAS=10;
// Misión que está visible hoy (2 días antes de su fecha, hasta su fecha)
function misionActiva(hoy){ const m=obstMision(hoy,addDays(hoy,7)).find(o=>o.ini<=hoy&&hoy<=o.fecha); return m||null; }
function obstaculos(desde,hasta){ return [...obst5S(desde,hasta),...obstEime(desde,hasta),...obstMision(desde,hasta)].sort((a,b)=>a.fecha.localeCompare(b.fecha)); }

/* ---- ¿quién cumplió cada obstáculo? ---- */
const zonasDe=uid=>planosDB().reduce((n,p)=>n+p.zonas.filter(z=>z.resp===uid).length,0);
function cumple(o,u){
  if(o.tipo==="eime"){ const eq=misEq(u.id).filter(e=>(e.freq==="quincenal")===(o.f==="quincenal"));
    if(!eq.length) return null;
    return eq.every(e=>verifEn(e,periodoEime(e.freq,o.fecha))); }
  if(!zonasDe(u.id)) return null;
  return evid5().some(e=>e.uid===u.id&&e.ver==="APROBADO"&&e.fecha>=o.ini&&e.fecha<=o.fecha);
}

function cicloActual(){ const hoy=hoyS(); let ini=RUTA_INICIO, n=1;
  while(addDays(ini,CICLO_DIAS)<=hoy){ ini=addDays(ini,CICLO_DIAS); n++; }
  return {n,ini,fin:addDays(ini,CICLO_DIAS-1)}; }
// Avance del equipo en el ciclo: EIME al día + evidencias 5S aprobadas por plano y por zona
function avanceEquipo(c){
  const hoy=hoyS();
  let eTot=0, eOk=0;
  DB.equipos.filter(e=>activoEq(e)&&e.resp).forEach(e=>{ let per=periodoEime(e.freq,c.ini<RUTA_INICIO?RUTA_INICIO:c.ini);
    while(per.fin<=c.fin){ const v=verifEn(e,per); if(per.fin<hoy||v){ eTot++; if(v) eOk++; } per=sigPeriodo(e.freq,per); } });
  const P=planosDB().filter(p=>p.zonas.length), E=evid5().filter(x=>x.ver==="APROBADO"&&x.rev!=="OBSERVADA"&&x.fecha>=c.ini&&x.fecha<=c.fin);
  const porPlano=P.map(p=>E.filter(x=>x.plano===p.id).length);
  const Z=P.reduce((n,p)=>n+p.zonas.length,0), zOk=P.reduce((n,p)=>n+p.zonas.filter(z=>E.some(x=>x.zona===z.id)).length,0);
  const fE=eTot?eOk/eTot:1, f1=P.length?porPlano.filter(n=>n>=1).length/P.length:0;
  const f5=P.length?porPlano.reduce((s,n)=>s+Math.min(n,5),0)/(5*P.length):0, fZ=Z?zOk/Z:0;
  const b=(fE+f1)/2;
  const pct=b<1?Math.floor(50*b):f5<1?50+Math.floor(20*f5):fZ<1?70+Math.floor(20*fZ):100;
  return {pct,eTot,eOk,planos:P.length,p1:porPlano.filter(n=>n>=1).length,p5:porPlano.reduce((s,n)=>s+Math.min(n,5),0),zonas:Z,zOk,eimeAlDia:eOk===eTot};
}

/* ====================== CUADRO DE HONOR ======================
   Dos reconocimientos por ciclo: mejor EIME y mejor gestión 5S.
   Nadie lleva dos: si la misma persona gana ambos, es «Mejor de todo». */
function honorEime(c){
  const hoy=hoyS();
  return activos().map(u=>{
    let tot=0, ok=0, ultima="";
    DB.equipos.filter(e=>activoEq(e)&&e.resp===u.id).forEach(e=>{
      let per=periodoEime(e.freq,c.ini<RUTA_INICIO?RUTA_INICIO:c.ini);
      while(per.fin<=c.fin){
        const v=DB.verif.filter(x=>x.eq===e.id&&x.fecha>=per.ini&&x.fecha<=per.finCal).sort((a,b)=>a.fecha<b.fecha?-1:1)[0];
        if(per.fin<hoy||v){ tot++; if(v){ ok++; if(v.fecha>ultima) ultima=v.fecha; } }
        per=sigPeriodo(e.freq,per);
      } });
    return {u,tot,ok,atrasos:tot-ok,pct:tot?ok/tot:0,ultima};
  }).filter(x=>x.tot>0&&x.ok>0)
    .sort((a,b)=>b.pct-a.pct||a.atrasos-b.atrasos||b.ok-a.ok||(a.ultima<b.ultima?-1:a.ultima>b.ultima?1:0));
}
function honor5s(c){
  const E=evid5().filter(x=>x.ver==="APROBADO"&&x.rev!=="OBSERVADA"&&x.fecha>=c.ini&&x.fecha<=c.fin);
  return activos().map(u=>{
    const m=E.filter(x=>x.uid===u.id);
    return {u,n:m.length,pts:m.reduce((s,x)=>s+(x.puntaje||0),0),

function diasActivos(t0,t1,pausas){
  let tot=Math.max(0,t1-t0);
  (pausas||[]).forEach(p=>{ const s=Math.max(t0,p[0]), e=Math.min(t1,p[1]==null?t1:p[1]); if(e>s) tot-=(e-s); });
  return Math.max(0,tot)/DAY;
}

function estado(e){ const hoy=hoyS(), per=periodoEime(e.freq,hoy);
  if(verifEn(e,per)) return {k:"ok",t:"Al día",d:diffDias(sigPeriodo(e.freq,per).fin)};
  const d=diffDias(per.fin);

function premioEime(e,fecha){

async function call(action,p){
  const body=Object.assign({action,uid:ST.sesion&&ST.sesion.id,pin:ST.sesion&&ST.sesion.pin},p||{});
  let r;
  if(!ONLINE){ r=LOCAL[action]?LOCAL[action](body):err("NO_IMPL","Acción no disponible."); }
  else{
    try{ const res=await fetch(CFG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); r=await res.json(); }
    catch(e){ r=err("RED","Sin conexión. Revisa tu internet e inténtalo de nuevo."); }
  }
  if(r.ok&&r.datos){ DB=r.datos; if(r.ahora) SKEW=r.ahora-Date.now(); }
  if(!ONLINE&&r.ok) recalc();
  if(!r.ok&&r.code==="PIN_INVALIDO"&&ST.sesion&&action!=="login"){ ST.sesion=null; vista="corral"; toast("Tu PIN cambió. Ingresa de nuevo.","!"); }
  persist();
  return r;
}

}
